# One-command local setup:  docker compose up -d --build   ->  http://localhost:5000
# Values can be overridden in a local .env file (see .env.example).
services:
  db:
    image: postgres:16
    container_name: barber-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-barberdb}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # schema.sql and seed.sql run automatically on the first start
      - ./db:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-barberdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    image: barber-app
    container_name: barber-app
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-barberdb}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      APP_PLATFORM: Docker Compose (local)
    ports:
      # macOS uses port 5000 for AirPlay -> run with APP_PORT=5050 docker compose up
      - "${APP_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
