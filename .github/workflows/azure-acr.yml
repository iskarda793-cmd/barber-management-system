# Option 1 (Azure): build image -> push to Azure Container Registry (ACR)
# Deployment of the new revision in Azure Container Apps is done manually.
#
# Required repository secrets:
#   ACR_LOGIN_SERVER  e.g. myregistry.azurecr.io
#   ACR_USERNAME      ACR admin username
#   ACR_PASSWORD      ACR admin password
name: Build and push to Azure Container Registry

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: barber-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check ACR secrets
        id: check
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
        run: |
          if [ -z "$ACR_LOGIN_SERVER" ]; then
            echo "::warning::ACR secrets not configured - skipping Azure build."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.check.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: steps.check.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        if: steps.check.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image (linux/amd64)
        if: steps.check.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
