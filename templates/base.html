<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Barber Management System{% endblock %}</title>
    <style>
        :root { --dark:#1d1f24; --gold:#c9a24b; --bg:#f4f1ea; --red:#c0392b; --green:#2e8b57; --blue:#2c6fbb; }
        * { box-sizing: border-box; }
        body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:#222; }
        header { background:var(--dark); color:#fff; }
        .bar { max-width:1100px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:28px; flex-wrap:wrap; }
        .brand { font-size:20px; font-weight:700; color:var(--gold); text-decoration:none; }
        .pole { display:inline-block; width:10px; height:22px; vertical-align:-4px; margin-right:6px; border-radius:3px;
                background:repeating-linear-gradient(45deg,#c0392b 0 4px,#fff 4px 8px,#2c6fbb 8px 12px,#fff 12px 16px); }
        nav a { color:#ddd; text-decoration:none; margin-right:18px; padding-bottom:4px; }
        nav a.active, nav a:hover { color:#fff; border-bottom:2px solid var(--gold); }
        main { max-width:1100px; margin:0 auto; padding:24px 20px 40px; }
        h1 { margin:6px 0 18px; }
        .card { background:#fff; border-radius:12px; box-shadow:0 4px 16px rgba(0,0,0,.07); padding:22px; margin-bottom:22px; }
        .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:16px; margin-bottom:22px; }
        .stat { background:#fff; border-radius:12px; padding:18px; box-shadow:0 4px 16px rgba(0,0,0,.07); border-top:4px solid var(--gold); }
        .stat .num { font-size:30px; font-weight:700; }
        .stat .lbl { color:#777; font-size:13px; text-transform:uppercase; letter-spacing:.5px; }
        table { width:100%; border-collapse:collapse; font-size:14px; }
        th, td { text-align:left; padding:10px 8px; border-bottom:1px solid #eee; vertical-align:middle; }
        th { background:#faf8f3; font-size:12px; text-transform:uppercase; color:#666; letter-spacing:.4px; }
        form.inline { display:inline; }
        .form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; align-items:end; }
        label { font-size:12px; color:#555; display:block; margin-bottom:4px; text-transform:uppercase; letter-spacing:.4px; }
        input, select, textarea { width:100%; padding:10px; border:1px solid #ccc; border-radius:8px; font-size:14px; font-family:inherit; }
        .btn { display:inline-block; padding:10px 18px; border:none; border-radius:8px; background:var(--dark); color:#fff;
               font-weight:600; cursor:pointer; text-decoration:none; font-size:14px; }
        .btn.gold { background:var(--gold); color:#1d1f24; }
        .btn.sm { padding:6px 12px; font-size:12px; }
        .btn.red { background:var(--red); }
        .btn.light { background:#e6e2d8; color:#333; }
        .badge { padding:3px 10px; border-radius:20px; font-size:12px; font-weight:600; color:#fff; }
        .badge.scheduled { background:var(--blue); } .badge.completed { background:var(--green); } .badge.cancelled { background:#999; }
        .alert { padding:12px 16px; border-radius:8px; margin-bottom:18px; font-size:14px; }
        .alert.err { background:#fdecea; border:1px solid var(--red); }
        .alert.ok { background:#e8f5ee; border:1px solid var(--green); }
        .muted { color:#888; font-size:13px; }
        footer { text-align:center; color:#999; font-size:12px; padding:20px; }
        .actions { white-space:nowrap; text-align:right; }
    </style>
</head>
<body>
<header>
    <div class="bar">
        <a class="brand" href="/"><span class="pole"></span>Barber Management System</a>
        <nav>
            {% set p = request.path %}
            <a href="/" class="{{ 'active' if p == '/' }}">Dashboard</a>
            <a href="/appointments" class="{{ 'active' if p.startswith('/appointments') }}">Appointments</a>
            <a href="/barbers" class="{{ 'active' if p.startswith('/barbers') }}">Barbers</a>
            <a href="/services" class="{{ 'active' if p.startswith('/services') }}">Services</a>
        </nav>
    </div>
</header>
<main>
    {% if error %}<div class="alert err">⚠️ {{ error }}</div>{% endif %}
    {% block content %}{% endblock %}
</main>
<footer>
    Running on <strong>{{ platform }}</strong> · container {{ hostname }} · DB {{ db_name }}@{{ db_host }} ·
    <a href="/health">/health</a> · <a href="/api/appointments">/api/appointments</a>
</footer>
</body>
</html>
